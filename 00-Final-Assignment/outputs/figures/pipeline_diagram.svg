<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="912" height="332" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#0F172A">End-to-End Leakage-Safe Analytical &amp; Decision Workflow (SEED = 42)</text>
  <text x="24" y="54" font-size="12" fill="#475569">Every transformation, encoder, and threshold is fit strictly on the 70% training split; the 30% test split is touched once for final reporting.</text>

  <!-- Step 1: Raw Data & Audit -->
  <rect x="22" y="74" width="196" height="175" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="22" y="74" width="196" height="32" rx="10" fill="#1D4ED8"/>
  <text x="120" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Data Audit &amp; 1:1 Join</text>
  <text x="34" y="124" font-size="11.5" font-weight="700" fill="#0F172A">• Client.csv + Record.csv</text>
  <text x="34" y="142" font-size="11" fill="#334155">  100,000 rows × 100 columns</text>
  <text x="34" y="162" font-size="11.5" font-weight="700" fill="#0F172A">• Stratified 70/30 Split</text>
  <text x="34" y="180" font-size="11" fill="#334155">  70,000 Train / 30,000 Test</text>
  <text x="34" y="200" font-size="11.5" font-weight="700" fill="#E11D48">• Data Hygiene Fixes</text>
  <text x="34" y="218" font-size="10.5" fill="#334155">  Clamp eqpdays &lt; 0 (133 rows)</text>
  <text x="34" y="234" font-size="10.5" fill="#334155">  Drop 10 duplicate _Mean cols</text>

  <line x1="218" y1="161" x2="244" y2="161" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Domain Features & Fairness -->
  <rect x="248" y="74" width="204" height="175" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="248" y="74" width="204" height="32" rx="10" fill="#1D4ED8"/>
  <text x="350" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">2. 20 Domain Features</text>
  <text x="260" y="124" font-size="11.5" font-weight="700" fill="#0F172A">• Lifecycle &amp; Device Signals</text>
  <text x="260" y="142" font-size="10.5" fill="#334155">  dev_age_gt_300, tenure_10_12</text>
  <text x="260" y="157" font-size="10.5" fill="#334155">  eqp_per_tenure_day ratio</text>
  <text x="260" y="177" font-size="11.5" font-weight="700" fill="#0F172A">• Usage Slump &amp; Friction</text>
  <text x="260" y="195" font-size="10.5" fill="#334155">  mou_ratio_3m, care_intensity</text>
  <text x="260" y="215" font-size="11.5" font-weight="700" fill="#0D9488">• Fairness Guardrail</text>
  <text x="260" y="233" font-size="10.5" fill="#334155">  Exclude ethnic (107 fair cols)</text>

  <line x1="452" y1="161" x2="478" y2="161" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: 5-Fold CV & Model Selection -->
  <rect x="482" y="74" width="196" height="175" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="482" y="74" width="196" height="32" rx="10" fill="#1D4ED8"/>
  <text x="580" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">3. 5-Fold Stratified CV</text>
  <text x="494" y="124" font-size="11.5" font-weight="700" fill="#0F172A">• 7 Candidate Models</text>
  <text x="494" y="142" font-size="10.5" fill="#334155">  Dummy, LogReg, Shallow Tree,</text>
  <text x="494" y="157" font-size="10.5" fill="#334155">  XGBoost (M3–M5), LightGBM (M6)</text>
  <text x="494" y="177" font-size="11.5" font-weight="700" fill="#0F172A">• Overfitting Control</text>
  <text x="494" y="195" font-size="10.5" fill="#334155">  depth=5, subsample=0.8,</text>
  <text x="494" y="210" font-size="10.5" fill="#334155">  colsample=0.8, reg_lambda=2</text>
  <text x="494" y="232" font-size="11" font-weight="700" fill="#0D9488">• Primary Metric: ROC-AUC</text>

  <line x1="678" y1="161" x2="704" y2="161" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Step 4: Top-k Ranking & Re-basing -->
  <rect x="708" y="74" width="190" height="175" rx="10" fill="#F0FDF4" stroke="#0D9488" stroke-width="2.2"/>
  <rect x="708" y="74" width="190" height="32" rx="10" fill="#0D9488"/>
  <text x="803" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">4. Top-k% Profit Engine</text>
  <text x="720" y="124" font-size="11.5" font-weight="700" fill="#0F172A">• Rank by Risk Score p̂_i</text>
  <text x="720" y="142" font-size="10.5" fill="#334155">  Select Top-10% (10,000 accts)</text>
  <text x="720" y="162" font-size="11.5" font-weight="700" fill="#0F172A">• Prior-Shift Re-basing</text>
  <text x="720" y="180" font-size="10.5" fill="#334155">  Adjust 49.6% sample prior to</text>
  <text x="720" y="195" font-size="10.5" fill="#334155">  realistic 5%–10% base rate</text>
  <text x="720" y="215" font-size="11.5" font-weight="700" fill="#0D9488">• Two-Lane Intervention</text>
  <text x="720" y="233" font-size="10.5" fill="#334155">  Matched to root risk driver</text>

  <!-- Bottom Governance Banner -->
  <rect x="22" y="266" width="876" height="52" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="38" y="287" font-size="12" font-weight="700" fill="#1E3A8A">Why Probability Ranking Beats 0.5-Cutoff Classification:</text>
  <text x="38" y="306" font-size="11.2" fill="#1E293B">A flat 0.5 cutoff flags ~15,000 test accounts regardless of campaign budget. Ranking by p̂_i lets CRM size contact volume k% to maximize net saved CLV minus offer cost.</text>
</svg>
